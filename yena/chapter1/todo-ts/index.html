<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>YEJIN TODO</h1>

  <div class="input-box">
    <input id="todoInput" type="text" placeholder="할 일 입력" />
    <button id="addBtn">할 일 추가</button>
  </div>

  <div class="todo-wrapper">
    <div>
      <h3>할 일</h3>
      <ul id="todoList"></ul>
    </div>

    <div>
      <h3>완료</h3>
      <ul id="doneList"></ul>
    </div>
  </div>
</div>

<script src="./dist/script.js"></script>

</body>

</html>
